<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komet TV - BMK Komet Badminton</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
        }

        #player {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide.fade-out {
            opacity: 0;
        }

        /* Image slides */
        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #f5f5f5;
        }

        /* Video slides */
        .slide video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slide.slide-image {
            background: #f5f5f5;
        }

        /* Announcement slides */
        .slide-announcement {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            flex-direction: column;
            padding: 60px;
            text-align: center;
            color: #fff;
        }

        .slide-announcement .announcement-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .slide-announcement .announcement-content {
            font-size: 2.2rem;
            line-height: 1.5;
            max-width: 80%;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .slide-announcement .announcement-content h1 { font-size: 3.5rem; margin-bottom: 20px; }
        .slide-announcement .announcement-content h2 { font-size: 3rem; margin-bottom: 15px; }
        .slide-announcement .announcement-content p { margin-bottom: 15px; }

        /* Vertical (portrait) mode - layout adjustments */
        body.vertical .slide-announcement {
            padding: 60px 40px;
        }

        body.vertical .slide-announcement .announcement-title {
            font-size: 3.2rem;
        }

        body.vertical .slide-announcement .announcement-content {
            font-size: 1.8rem;
            max-width: 90%;
        }

        /* Loading / Empty state */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 2rem;
            text-align: center;
            z-index: 100;
        }

        #status.hidden {
            display: none;
        }

        /* Clock overlay */
        #clock {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: rgba(0, 0, 0, 0.5);
            font-size: 1.8rem;
            font-weight: 300;
            z-index: 1000;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="player">
        <div id="status">
            <p>🏸 Komet TV</p>
            <p style="font-size: 1.2rem; margin-top: 10px; opacity: 0.7;">Loading playlist content...</p>
        </div>
        <div id="clock"></div>
    </div>

    <script>
        const PLAYER = document.getElementById('player');
        const STATUS = document.getElementById('status');
        const CLOCK = document.getElementById('clock');

        let playlist = [];
        let expandedPlaylist = []; // Flattened playlist (folders expanded into individual items)
        let currentIndex = -1;
        let currentSlide = null;
        let playlistVersion = '';
        let refreshInterval = 30;
        let advanceTimeout = null;
        let videoWatchdog = null;
        let lastSlideChange = Date.now();

        // Screen detection from URL: /display/{slug}
        const screenSlug = window.location.pathname.split('/display/')[1] || 'main';

        // Background music
        let bgMusic = null;
        let currentMusicUrl = null;
        let playlistMusic = null;  // Playlist-level background music (plays during all slides)
        let playlistMusicUrl = null;

        // --- Clock ---
        function updateClock() {
            const now = new Date();
            CLOCK.textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Playlist fetching ---
        async function fetchPlaylist() {
            try {
                const res = await fetch(`/api/playlist/player?screen=${screenSlug}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error('Failed to fetch playlist:', err);
                return null;
            }
        }

        async function fetchVersion() {
            try {
                const res = await fetch(`/api/playlist/version?screen=${screenSlug}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error('Failed to fetch version:', err);
                return null;
            }
        }

        // Expand playlist: folders become multiple items, each tagged with music_url
        function expandPlaylist(rawPlaylist) {
            const expanded = [];
            for (const item of rawPlaylist) {
                if (item.content_type === 'folder' && item.data.items) {
                    const musicUrl = item.data.music_url || null;
                    for (const fi of item.data.items) {
                        expanded.push({
                            content_type: fi.media_type, // 'image' or 'video'
                            duration: item.duration,
                            data: { url: fi.url, filename: fi.filename },
                            music_url: musicUrl,
                        });
                    }
                } else {
                    expanded.push({
                        ...item,
                        music_url: null, // Non-folder items have no background music
                    });
                }
            }
            return expanded;
        }

        async function checkForUpdates() {
            const versionData = await fetchVersion();
            if (!versionData) return;

            refreshInterval = versionData.refresh_seconds;

            // Handle playlist-level music
            handlePlaylistMusic(versionData.music_url);

            if (versionData.version !== playlistVersion) {
                const newPlaylist = await fetchPlaylist();
                if (newPlaylist) {
                    playlistVersion = versionData.version;
                    playlist = newPlaylist;
                    expandedPlaylist = expandPlaylist(playlist);

                    if (expandedPlaylist.length > 0) {
                        STATUS.classList.add('hidden');
                        if (currentIndex === -1) {
                            currentIndex = 0;
                            showSlide(currentIndex);
                        }
                    } else {
                        STATUS.classList.remove('hidden');
                        STATUS.innerHTML = '<p>🏸 Komet TV</p><p style="font-size: 1.2rem; margin-top: 10px; opacity: 0.6;">No playlist content</p>';
                    }
                }
            }
        }

        // --- Background Music ---
        function handlePlaylistMusic(musicUrl) {
            if (!musicUrl) {
                // No playlist music - stop if playing
                if (playlistMusic) {
                    playlistMusic.pause();
                    playlistMusic.src = '';
                    playlistMusic = null;
                    playlistMusicUrl = null;
                }
                return;
            }

            if (playlistMusicUrl === musicUrl) {
                // Same music, ensure it's playing
                if (playlistMusic && playlistMusic.paused) {
                    playlistMusic.play().catch(() => {});
                }
                return;
            }

            // New or changed music
            if (playlistMusic) {
                playlistMusic.pause();
                playlistMusic.src = '';
            }
            playlistMusic = new Audio(musicUrl);
            playlistMusic.loop = true;
            playlistMusic.volume = 0.7;
            playlistMusic.play().catch(() => {});
            playlistMusicUrl = musicUrl;
        }

        function handleMusic(item) {
            // If playlist-level music is active, it plays during everything (including videos)
            // Only handle folder-specific music if no playlist music
            if (playlistMusic && playlistMusicUrl) {
                // Playlist music is playing — don't stop it for videos
                // Mute video audio so it doesn't clash with playlist music
                if (item.content_type === 'video' && currentSlide) {
                    const video = currentSlide.querySelector('video');
                    if (video) video.muted = true;
                }
                return;
            }

            // Folder-specific music behavior (pause during videos)
            if (item.content_type === 'video') {
                if (bgMusic && !bgMusic.paused) {
                    bgMusic.pause();
                }
                return;
            }

            if (item.music_url) {
                if (currentMusicUrl !== item.music_url) {
                    stopMusic();
                    bgMusic = new Audio(item.music_url);
                    bgMusic.loop = true;
                    bgMusic.volume = 0.7;
                    bgMusic.play().catch(() => {});
                    currentMusicUrl = item.music_url;
                } else if (bgMusic && bgMusic.paused) {
                    bgMusic.play().catch(() => {});
                }
            } else {
                stopMusic();
            }
        }

        function stopMusic() {
            if (bgMusic) {
                bgMusic.pause();
                bgMusic.src = '';
                bgMusic = null;
            }
            currentMusicUrl = null;
        }

        // --- Slide rendering ---
        function createSlide(item) {
            const slide = document.createElement('div');
            slide.className = 'slide';

            // Cache-bust URLs to prevent stale media on TV Bro/WebView
            const cacheBust = `?v=${Date.now()}`;

            switch (item.content_type) {
                case 'image':
                    slide.classList.add('slide-image');
                    slide.innerHTML = `<img src="${item.data.url}${cacheBust}" alt="${item.data.filename || ''}" />`;
                    break;

                case 'video':
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.playsInline = true;
                    video.muted = false;
                    video.preload = 'auto';
                    // Explicitly reset and load to prevent WebView freezing
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                    video.src = item.data.url + cacheBust;
                    video.load();
                    video.play().catch(() => {});
                    slide.appendChild(video);
                    break;

                case 'announcement':
                    slide.classList.add('slide-announcement');
                    if (item.data.background_color) {
                        slide.style.background = item.data.background_color;
                    }
                    const titleStyle = `${item.data.title_color ? 'color:' + item.data.title_color + ';' : ''}${item.data.title_size ? 'font-size:' + item.data.title_size + ';' : ''}`;
                    const contentStyle = `${item.data.content_color ? 'color:' + item.data.content_color + ';' : ''}${item.data.content_size ? 'font-size:' + item.data.content_size + ';' : ''}`;
                    slide.innerHTML = `
                        <div class="announcement-title" style="${titleStyle}">${escapeHtml(item.data.title)}</div>
                        <div class="announcement-content" style="${contentStyle}">${item.data.content}</div>
                    `;
                    break;
            }

            return slide;
        }

        function showSlide(index) {
            if (expandedPlaylist.length === 0) return;

            const item = expandedPlaylist[index];
            const newSlide = createSlide(item);

            // Place new slide on top
            newSlide.style.zIndex = 2;
            PLAYER.appendChild(newSlide);

            // Fade in the new slide
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    newSlide.classList.add('active');
                });
            });

            // Fade out and remove old slide after transition
            if (currentSlide) {
                const oldSlide = currentSlide;
                oldSlide.style.zIndex = 1;
                // Wait for new slide to fully fade in, then clean up old
                setTimeout(() => {
                    // Properly destroy video elements to free memory
                    const oldVideo = oldSlide.querySelector('video');
                    if (oldVideo) {
                        oldVideo.pause();
                        oldVideo.removeAttribute('src');
                        oldVideo.load();
                    }
                    if (oldSlide.parentNode) {
                        oldSlide.parentNode.removeChild(oldSlide);
                    }
                }, 1200); // Slightly longer than transition (1s)
            }

            currentSlide = newSlide;

            // Handle background music
            handleMusic(item);

            // Schedule next slide
            scheduleNext(item);
        }

        function scheduleNext(item) {
            if (advanceTimeout) {
                clearTimeout(advanceTimeout);
                advanceTimeout = null;
            }
            if (videoWatchdog) {
                clearInterval(videoWatchdog);
                videoWatchdog = null;
            }

            if (item.content_type === 'video') {
                const video = currentSlide.querySelector('video');
                if (video) {
                    video.addEventListener('ended', advanceSlide, { once: true });
                    video.addEventListener('error', () => {
                        advanceTimeout = setTimeout(advanceSlide, 3000);
                    }, { once: true });

                    // Watchdog: if video is stuck for 20 seconds, skip it
                    let lastTime = -1;
                    let stuckCount = 0;
                    videoWatchdog = setInterval(() => {
                        if (!video.paused && video.currentTime === lastTime) {
                            stuckCount++;
                        } else {
                            stuckCount = 0;
                        }
                        lastTime = video.currentTime;
                        if (stuckCount >= 4) { // 4 * 5s = 20 seconds stuck
                            clearInterval(videoWatchdog);
                            videoWatchdog = null;
                            video.pause();
                            video.removeAttribute('src');
                            video.load();
                            advanceSlide();
                        }
                    }, 5000);

                    // Failsafe: no video should play longer than 5 minutes
                    advanceTimeout = setTimeout(() => {
                        if (videoWatchdog) { clearInterval(videoWatchdog); videoWatchdog = null; }
                        advanceSlide();
                    }, 5 * 60 * 1000);
                } else {
                    advanceTimeout = setTimeout(advanceSlide, 5000);
                }
            } else {
                const duration = item.duration * 1000;
                advanceTimeout = setTimeout(advanceSlide, duration);
            }
        }

        function advanceSlide() {
            if (expandedPlaylist.length === 0) return;
            lastSlideChange = Date.now();
            currentIndex = (currentIndex + 1) % expandedPlaylist.length;
            showSlide(currentIndex);
        }

        // --- Utilities ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Initialization ---
        async function init() {
            // Fetch display settings
            await loadDisplaySettings();

            await checkForUpdates();

            setInterval(() => {
                checkForUpdates();
                loadDisplaySettings();
            }, refreshInterval * 1000);
        }

        async function loadDisplaySettings() {
            try {
                const res = await fetch(`/api/screens/by-slug/${screenSlug}`);
                if (res.ok) {
                    const screen = await res.json();
                    if (screen) {
                        applyOrientation(screen.orientation);
                        applyRotation(screen.rotation || '0');
                        return;
                    }
                }
                // Fallback to global settings
                const settingsRes = await fetch('/api/settings');
                if (settingsRes.ok) {
                    const settings = await settingsRes.json();
                    applyOrientation(settings.orientation);
                    applyRotation(settings.rotation || '0');
                }
            } catch (err) {
                console.log('Failed to load settings:', err);
            }
        }

        function applyOrientation(orientation) {
            document.body.classList.remove('vertical', 'horizontal');
            document.body.classList.add(orientation);
        }

        function applyRotation(degrees) {
            const player = document.getElementById('player');
            const deg = parseInt(degrees) || 0;

            // Reset inline styles
            player.removeAttribute('style');

            if (deg === 0) {
                // No rotation needed
            } else if (deg === 90 || deg === 270) {
                player.style.transform = `rotate(${deg}deg)`;
                player.style.transformOrigin = 'center center';
                player.style.width = '100vh';
                player.style.height = '100vw';
                player.style.position = 'fixed';
                player.style.top = '50%';
                player.style.left = '50%';
                player.style.marginTop = 'calc(-50vw)';
                player.style.marginLeft = 'calc(-50vh)';
            } else if (deg === 180) {
                player.style.transform = 'rotate(180deg)';
                player.style.transformOrigin = 'center center';
            }
        }

        // Prevent screen from sleeping
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock not supported or failed:', err);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // Start
        requestWakeLock();
        init();

        // Page-level watchdog: if no slide change for 3 minutes, reload page
        setInterval(() => {
            if (expandedPlaylist.length > 0 && (Date.now() - lastSlideChange) > 3 * 60 * 1000) {
                console.log('Player stuck — reloading page');
                location.reload();
            }
        }, 30000);
    </script>
</body>
</html>
