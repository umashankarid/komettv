<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komet TV - BMK Komet Badminton</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
        }

        #player {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Image slides */
        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Video slides */
        .slide video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Announcement slides */
        .slide-announcement {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            flex-direction: column;
            padding: 60px;
            text-align: center;
            color: #fff;
        }

        .slide-announcement .announcement-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .slide-announcement .announcement-content {
            font-size: 2.2rem;
            line-height: 1.5;
            max-width: 80%;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .slide-announcement .announcement-content h1 { font-size: 3.5rem; margin-bottom: 20px; }
        .slide-announcement .announcement-content h2 { font-size: 3rem; margin-bottom: 15px; }
        .slide-announcement .announcement-content p { margin-bottom: 15px; }

        /* Vertical (portrait) mode adjustments */
        body.vertical .slide-announcement {
            padding: 80px 40px;
        }

        body.vertical .slide-announcement .announcement-title {
            font-size: 3.2rem;
        }

        body.vertical .slide-announcement .announcement-content {
            font-size: 1.8rem;
            max-width: 90%;
        }

        body.vertical .slide img,
        body.vertical .slide video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        body.vertical #clock {
            font-size: 1.4rem;
            bottom: 15px;
            right: 20px;
        }

        /* Loading / Empty state */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 2rem;
            text-align: center;
            z-index: 100;
        }

        #status.hidden {
            display: none;
        }

        /* Clock overlay */
        #clock {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.8rem;
            font-weight: 300;
            z-index: 1000;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="player">
        <div id="status">
            <p>🏸 Komet TV</p>
            <p style="font-size: 1.2rem; margin-top: 10px; opacity: 0.7;">Loading playlist content...</p>
        </div>
    </div>
    <div id="clock"></div>

    <script>
        const PLAYER = document.getElementById('player');
        const STATUS = document.getElementById('status');
        const CLOCK = document.getElementById('clock');

        let playlist = [];
        let expandedPlaylist = []; // Flattened playlist (folders expanded into individual items)
        let currentIndex = -1;
        let currentSlide = null;
        let playlistVersion = '';
        let refreshInterval = 30;
        let advanceTimeout = null;

        // Background music
        let bgMusic = null;
        let currentMusicUrl = null;

        // --- Clock ---
        function updateClock() {
            const now = new Date();
            CLOCK.textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Playlist fetching ---
        async function fetchPlaylist() {
            try {
                const res = await fetch('/api/playlist/player');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error('Failed to fetch playlist:', err);
                return null;
            }
        }

        async function fetchVersion() {
            try {
                const res = await fetch('/api/playlist/version');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error('Failed to fetch version:', err);
                return null;
            }
        }

        // Expand playlist: folders become multiple items, each tagged with music_url
        function expandPlaylist(rawPlaylist) {
            const expanded = [];
            for (const item of rawPlaylist) {
                if (item.content_type === 'folder' && item.data.items) {
                    const musicUrl = item.data.music_url || null;
                    for (const fi of item.data.items) {
                        expanded.push({
                            content_type: fi.media_type, // 'image' or 'video'
                            duration: item.duration,
                            data: { url: fi.url, filename: fi.filename },
                            music_url: musicUrl,
                        });
                    }
                } else {
                    expanded.push({
                        ...item,
                        music_url: null, // Non-folder items have no background music
                    });
                }
            }
            return expanded;
        }

        async function checkForUpdates() {
            const versionData = await fetchVersion();
            if (!versionData) return;

            refreshInterval = versionData.refresh_seconds;

            if (versionData.version !== playlistVersion) {
                const newPlaylist = await fetchPlaylist();
                if (newPlaylist) {
                    playlistVersion = versionData.version;
                    playlist = newPlaylist;
                    expandedPlaylist = expandPlaylist(playlist);

                    if (expandedPlaylist.length > 0) {
                        STATUS.classList.add('hidden');
                        if (currentIndex === -1) {
                            currentIndex = 0;
                            showSlide(currentIndex);
                        }
                    } else {
                        STATUS.classList.remove('hidden');
                        STATUS.innerHTML = '<p>🏸 Komet TV</p><p style="font-size: 1.2rem; margin-top: 10px; opacity: 0.7;">No playlist content</p>';
                    }
                }
            }
        }

        // --- Background Music ---
        function handleMusic(item) {
            if (item.content_type === 'video') {
                // Pause music during video playback
                if (bgMusic && !bgMusic.paused) {
                    bgMusic.pause();
                }
                return;
            }

            if (item.music_url) {
                // Start or continue music for this folder
                if (currentMusicUrl !== item.music_url) {
                    // Different music — switch
                    stopMusic();
                    bgMusic = new Audio(item.music_url);
                    bgMusic.loop = true;
                    bgMusic.volume = 0.7;
                    bgMusic.play().catch(() => {});
                    currentMusicUrl = item.music_url;
                } else if (bgMusic && bgMusic.paused) {
                    // Same music was paused (after a video) — resume
                    bgMusic.play().catch(() => {});
                }
            } else {
                // No music for this item — stop any playing music
                stopMusic();
            }
        }

        function stopMusic() {
            if (bgMusic) {
                bgMusic.pause();
                bgMusic.src = '';
                bgMusic = null;
            }
            currentMusicUrl = null;
        }

        // --- Slide rendering ---
        function createSlide(item) {
            const slide = document.createElement('div');
            slide.className = 'slide';

            switch (item.content_type) {
                case 'image':
                    slide.innerHTML = `<img src="${item.data.url}" alt="${item.data.filename || ''}" />`;
                    break;

                case 'video':
                    slide.innerHTML = `<video src="${item.data.url}" autoplay playsinline></video>`;
                    break;

                case 'announcement':
                    slide.classList.add('slide-announcement');
                    if (item.data.background_color) {
                        slide.style.background = item.data.background_color;
                    }
                    slide.innerHTML = `
                        <div class="announcement-title">${escapeHtml(item.data.title)}</div>
                        <div class="announcement-content">${item.data.content}</div>
                    `;
                    break;
            }

            return slide;
        }

        function showSlide(index) {
            if (expandedPlaylist.length === 0) return;

            const item = expandedPlaylist[index];
            const newSlide = createSlide(item);

            PLAYER.appendChild(newSlide);

            // Trigger reflow for transition
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    newSlide.classList.add('active');
                });
            });

            // Fade out and remove old slide
            if (currentSlide) {
                const oldSlide = currentSlide;
                oldSlide.classList.remove('active');
                setTimeout(() => {
                    if (oldSlide.parentNode) {
                        oldSlide.parentNode.removeChild(oldSlide);
                    }
                }, 1000);
            }

            currentSlide = newSlide;

            // Handle background music
            handleMusic(item);

            // Schedule next slide
            scheduleNext(item);
        }

        function scheduleNext(item) {
            if (advanceTimeout) {
                clearTimeout(advanceTimeout);
                advanceTimeout = null;
            }

            if (item.content_type === 'video') {
                const video = currentSlide.querySelector('video');
                if (video) {
                    video.addEventListener('ended', advanceSlide, { once: true });
                    video.addEventListener('error', () => {
                        advanceTimeout = setTimeout(advanceSlide, 5000);
                    }, { once: true });
                } else {
                    advanceTimeout = setTimeout(advanceSlide, 5000);
                }
            } else {
                const duration = item.duration * 1000;
                advanceTimeout = setTimeout(advanceSlide, duration);
            }
        }

        function advanceSlide() {
            if (expandedPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % expandedPlaylist.length;
            showSlide(currentIndex);
        }

        // --- Utilities ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Initialization ---
        async function init() {
            // Fetch display settings
            await loadDisplaySettings();

            await checkForUpdates();

            setInterval(() => {
                checkForUpdates();
            }, refreshInterval * 1000);

            // Refresh settings every 5 minutes
            setInterval(loadDisplaySettings, 5 * 60 * 1000);
        }

        async function loadDisplaySettings() {
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const settings = await res.json();
                    applyOrientation(settings.orientation);
                }
            } catch (err) {
                console.log('Failed to load settings:', err);
            }
        }

        function applyOrientation(orientation) {
            document.body.classList.remove('vertical', 'horizontal');
            document.body.classList.add(orientation);
        }

        // Prevent screen from sleeping
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock not supported or failed:', err);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // Start
        requestWakeLock();
        init();
    </script>
</body>
</html>
